services:
  - type: web
    name: smart-campus-backend
    env: node
    rootDir: smart-campus-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://smart-campus-platform-identa.vercel.app
      - key: NODE_ENV
        value: production
